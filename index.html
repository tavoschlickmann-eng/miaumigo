<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Miaumigo</title>
  <meta name="description" content="Cuide da saúde, agenda e gastos dos seus pets em um só lugar.">
  <meta name="theme-color" content="#E8663D">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="app"></main>

  <nav class="tabbar" aria-label="Navegação principal">
    <a href="#/inicio" data-tab="inicio"><span class="tab-ico" data-icon="house"></span><span>Início</span></a>
    <a href="#/pets" data-tab="pets"><span class="tab-ico" data-icon="paw-print"></span><span>Pets</span></a>
    <a href="#/agenda" data-tab="agenda"><span class="tab-ico" data-icon="calendar-days"></span><span>Agenda</span></a>
    <a href="#/gastos" data-tab="gastos"><span class="tab-ico" data-icon="wallet"></span><span>Gastos</span></a>
  </nav>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div id="sheet-body"></div>
  </dialog>

  <dialog id="viewer" class="viewer" aria-label="Visualizar anexo"></dialog>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="icons.js"></script>
  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="app.js"></script>
  <script src="sync.js"></script>
</body>
</html>
